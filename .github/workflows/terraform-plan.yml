# .github/workflows/terraform-plan.yml
# Runs on every Pull Request → posts a Terraform plan as a PR comment.
# Branch convention:
#   PRs into  main  → plan with prod.tfvars
#   PRs into  dev   → plan with dev.tfvars

name: Terraform Plan

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-*.yml"

permissions:
  contents: read
  pull-requests: write   # needed to post plan as PR comment

env:
  TF_VERSION: "1.8.2"
  AWS_REGION: "us-east-1"
  WORKING_DIR: "./terraform"

jobs:
  plan:
    name: Terraform Plan (${{ github.base_ref }})
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Configure AWS credentials ────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # ── 3. Setup Terraform ──────────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Write EC2 SSH key
        run: |
          mkdir -p /home/runner/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > /home/runner/.ssh/linux.pem
          chmod 600 /home/runner/.ssh/linux.pem    

      # ── 4. Determine environment from target branch ──────────────────────
      - name: Set environment
        id: env
        run: |
          if [[ "${{ github.base_ref }}" == "main" ]]; then
            echo "env=prod"    >> $GITHUB_OUTPUT
            echo "tfvars=environments/prod.tfvars" >> $GITHUB_OUTPUT
          else
            echo "env=dev"     >> $GITHUB_OUTPUT
            echo "tfvars=environments/dev.tfvars"  >> $GITHUB_OUTPUT
          fi

      # ── 5. Terraform Init ───────────────────────────────────────────────
      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="key=grafana-eks/${{ steps.env.outputs.env }}/terraform.tfstate"

      # ── 6. Terraform Format check ───────────────────────────────────────
      - name: Terraform Format
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform fmt -check -recursive

      # ── 7. Terraform Validate ───────────────────────────────────────────
      - name: Terraform Validate
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform validate

      # ── 8. Terraform Plan ───────────────────────────────────────────────
      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          TF_VAR_ec2_private_key_path: /home/runner/.ssh/linux.pem  # absolute path, not secret
        run: |
          terraform plan \
            -var-file="${{ steps.env.outputs.tfvars }}" \
            -no-color \
            -out=tfplan \
          2>&1 | tee plan_output.txt
          echo "exitcode=$?" >> $GITHUB_OUTPUT

      # ── 9. Post plan as PR comment ───────────────────────────────────────
      - name: Post Plan as PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.WORKING_DIR }}/plan_output.txt', 'utf8');
            const maxLen = 65000;
            const truncated = plan.length > maxLen
              ? plan.slice(0, maxLen) + '\n\n... (truncated — see Actions log for full output)'
              : plan;

            const body = `## Terraform Plan — \`${{ steps.env.outputs.env }}\` environment

            <details><summary>Show Plan</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`

            </details>

            **Workflow:** \`${{ github.workflow }}\` | **Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              body,
            });
      
      - name: Cleanup SSH key
        if: always()
        run: rm -f /home/runner/.ssh/linux.pem